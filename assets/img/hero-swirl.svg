<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 1046" width="1456" height="1046" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Light blue abstract swirl of overlapping circles">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2=".92">
      <stop offset="0" stop-color="#D7E9F6"/>
      <stop offset=".48" stop-color="#E5F1FA"/>
      <stop offset="1" stop-color="#F2F9FD"/>
    </linearGradient>
    <radialGradient id="hero-glow-left" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".8"/>
      <stop offset=".62" stop-color="#FFFFFF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-petal" x1=".15" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#DDEEF9" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="hero-swirl" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".86"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".58"/>
      <stop offset="1" stop-color="#E4F2FB" stop-opacity=".42"/>
    </linearGradient>
  </defs>

  <rect width="1456" height="1046" fill="url(#hero-bg)"/>

  <!-- Soft light pooling behind the left-hand petal cluster -->
  <ellipse cx="540" cy="590" rx="560" ry="480" fill="url(#hero-glow-left)"/>

  <!-- Overlapping petal circles, left -->
  <g fill="url(#hero-petal)">
    <circle cx="470" cy="520" r="425"/>
    <circle cx="505" cy="470" r="405"/>
    <circle cx="525" cy="600" r="415"/>
    <circle cx="585" cy="555" r="385"/>
  </g>
  <g fill="none" stroke="#A2C8E3" stroke-width="1.25" opacity=".72">
    <circle cx="470" cy="520" r="425"/>
    <circle cx="505" cy="470" r="405"/>
    <circle cx="525" cy="600" r="415"/>
    <circle cx="585" cy="555" r="385"/>
  </g>

  <!-- Swirling right-hand form -->
  <path d="M846 512c52-118 178-206 322-194 166 14 272 158 246 312-24 142-166 244-312 228-104-12-168-74-196-146-26-66-90-100-60-200Z" fill="url(#hero-swirl)"/>
  <g fill="url(#hero-swirl)" stroke="#A2C8E3" stroke-width="1.25">
    <circle cx="1148" cy="296" r="330"/>
    <circle cx="1264" cy="472" r="332"/>
    <circle cx="1142" cy="692" r="360"/>
    <circle cx="944" cy="604" r="262"/>
  </g>

  <!-- Echoing wave arcs through the centre -->
  <g fill="none" stroke="#A2C8E3" stroke-width="1.25" opacity=".62" stroke-linecap="round">
    <path d="M806 486c116-70 236-164 404-166"/>
    <path d="M800 530c120-44 238-116 404-104"/>
    <path d="M806 604c122-36 224-108 390-92"/>
    <path d="M840 682c118-20 226-92 372-58"/>
    <path d="M880 754c104-10 196-60 320-26"/>
  </g>

  <!-- Fine concentric accents, left -->
  <g fill="none" stroke="#B2D2E8" stroke-width="1" opacity=".5">
    <circle cx="538" cy="556" r="330"/>
    <circle cx="538" cy="556" r="244"/>
    <circle cx="538" cy="556" r="162"/>
  </g>
</svg>
